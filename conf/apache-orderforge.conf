# OrderForge virtual host for Apache 2.4.
#
#   Static storefront and admin console: served from /var/www/orderforge
#   /api/*: forwarded over FastCGI to the pre-forked of-api workers
#
# Installed by scripts/install-site.sh. Runs on port 8080 so the distribution's
# default site on port 80 is left alone.

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/orderforge

    <Directory /var/www/orderforge>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.html

    # Apache passes the original REQUEST_URI ("/api/...") and every request header as
    # an HTTP_* parameter (cookie, X-CSRF-Token).
    #
    # Do NOT add enablereuse=on here. With connection reuse, libfcgi keeps a worker
    # reading the same idle connection after each response instead of going back to
    # accept(); once Apache holds one idle connection per of-api worker, every worker is
    # pinned and new requests are never accepted (a deadlock seen in testing). A fresh
    # localhost connection per request costs microseconds.
    ProxyPass        "/api/" "fcgi://127.0.0.1:9000/" timeout=30
    ProxyTimeout 30

    # Defence in depth for the browser side.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

    # Request bodies are small JSON objects; reject anything large at the edge.
    LimitRequestBody 65536

    ErrorLog  ${APACHE_LOG_DIR}/orderforge-error.log
    CustomLog ${APACHE_LOG_DIR}/orderforge-access.log combined
</VirtualHost>
