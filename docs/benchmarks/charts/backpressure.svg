<text x="200.0" y="356.0" class="t3" text-anchor="middle">100</text>
<text x="286.7" y="356.0" class="t3" text-anchor="middle">250</text>
<text x="373.3" y="356.0" class="t3" text-anchor="middle">500</text>
<text x="460.0" y="356.0" class="t3" text-anchor="middle">1000</text>
<text x="546.7" y="356.0" class="t3" text-anchor="middle">2000</text>
<text x="330.0" y="374.0" class="t2" text-anchor="middle">concurrent clients</text>
<path d="M113.3,333.8 L200.0,333.8 L286.7,333.8 L373.3,333.2 L460.0,333.0 L546.7,333.3" class="s3" fill="none" style="fill:none" stroke-width="2" stroke-linejoin="round"/>
<circle cx="113.3" cy="333.8" r="4" class="s3 gap" stroke-width="2" style="stroke-width:2"><title>25 clients: 515 served per second</title></circle>
<circle cx="200.0" cy="333.8" r="4" class="s3 gap" stroke-width="2" style="stroke-width:2"><title>100 clients: 515 served per second</title></circle>
<circle cx="286.7" cy="333.8" r="4" class="s3 gap" stroke-width="2" style="stroke-width:2"><title>250 clients: 517 served per second</title></circle>
