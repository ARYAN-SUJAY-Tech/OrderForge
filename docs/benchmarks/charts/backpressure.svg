<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="Backpressure: a small core pushed past capacity">

<style>
  .bg { fill: none; }
  .t1 { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .t2 { fill: #52514e; font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .t3 { fill: #52514e; font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .lab { fill: #0b0b0b; font: 600 11px system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .grid { stroke: #e4e3de; stroke-width: 1; }
  .axis { stroke: #8a8984; stroke-width: 1; }
  .ref { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .gap { stroke: #ffffff; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; }
  .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .s4 { fill: #eda100; stroke: #eda100; }
  .s8 { fill: #e34948; stroke: #e34948; }
  @media (prefers-color-scheme: dark) {
    .t1, .lab { fill: #f0efec; }
    .t2, .t3 { fill: #c3c2b7; }
    .grid { stroke: #3a3935; }
    .axis { stroke: #77766f; }
    .ref { stroke: #c3c2b7; }
    .gap { stroke: #1a1a19; }
    .s1 { fill: #3987e5; stroke: #3987e5; }
    .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; }
    .s4 { fill: #c98500; stroke: #c98500; }
    .s8 { fill: #e66767; stroke: #e66767; }
  }
</style>

<title>Backpressure: a small core pushed past capacity</title>
<text x="16.0" y="24.0" class="t1" text-anchor="start">Backpressure: a small core pushed past capacity</text>
<text x="16.0" y="42.0" class="t2" text-anchor="start">2 core workers, 16-slot job queue, 64 API workers; requests per second by outcome</text>
<line x1="70.0" y1="340.0" x2="590.0" y2="340.0" class="axis"/>
<text x="64.0" y="344.0" class="t3" text-anchor="end">0</text>
<line x1="70.0" y1="280.0" x2="590.0" y2="280.0" class="grid"/>
<text x="64.0" y="284.0" class="t3" text-anchor="end">5k</text>
<line x1="70.0" y1="220.0" x2="590.0" y2="220.0" class="grid"/>
<text x="64.0" y="224.0" class="t3" text-anchor="end">10k</text>
<line x1="70.0" y1="160.0" x2="590.0" y2="160.0" class="grid"/>
<text x="64.0" y="164.0" class="t3" text-anchor="end">15k</text>
<line x1="70.0" y1="100.0" x2="590.0" y2="100.0" class="grid"/>
<text x="64.0" y="104.0" class="t3" text-anchor="end">20k</text>
<text x="70.0" y="92.0" class="t2" text-anchor="start">requests per second</text>
