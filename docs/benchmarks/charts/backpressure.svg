<circle cx="546.7" cy="333.3" r="4" class="s3 gap" stroke-width="2" style="stroke-width:2"><title>2000 clients: 561 served per second</title></circle>
<path d="M113.3,302.6 L200.0,163.5 L286.7,154.6 L373.3,169.9 L460.0,162.5 L546.7,164.8" class="s4" fill="none" style="fill:none" stroke-width="2" stroke-linejoin="round"/>
<circle cx="113.3" cy="302.6" r="4" class="s4 gap" stroke-width="2" style="stroke-width:2"><title>25 clients: 3118 refused as busy per second</title></circle>
<circle cx="200.0" cy="163.5" r="4" class="s4 gap" stroke-width="2" style="stroke-width:2"><title>100 clients: 14707 refused as busy per second</title></circle>
<circle cx="286.7" cy="154.6" r="4" class="s4 gap" stroke-width="2" style="stroke-width:2"><title>250 clients: 15454 refused as busy per second</title></circle>
<circle cx="373.3" cy="169.9" r="4" class="s4 gap" stroke-width="2" style="stroke-width:2"><title>500 clients: 14171 refused as busy per second</title></circle>
<circle cx="460.0" cy="162.5" r="4" class="s4 gap" stroke-width="2" style="stroke-width:2"><title>1000 clients: 14793 refused as busy per second</title></circle>
<circle cx="546.7" cy="164.8" r="4" class="s4 gap" stroke-width="2" style="stroke-width:2"><title>2000 clients: 14599 refused as busy per second</title></circle>
