<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderForge – Admin · Orders</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>Admin · Order board</h1>
    <div class="toolbar">
      <select id="status" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="placed">Placed</option>
        <option value="payment_pending">Payment pending</option>
        <option value="paid">Paid</option>
        <option value="packed">Packed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
        <option value="refunded">Refunded</option>
      </select>
      <span class="muted" id="count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Order</th><th>Customer</th><th>Placed</th><th>Status</th><th class="num">Items</th><th class="num">Total</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>
  <script src="/assets/app.js"></script>
  <script src="/assets/admin-orders.js"></script>
</body>
</html>
