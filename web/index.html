<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderForge – Shop</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>Shop</h1>
    <form class="toolbar" id="filters">
      <input type="search" id="q" placeholder="Search products or SKU" maxlength="64" aria-label="Search">
      <select id="category" aria-label="Category"><option value="0">All categories</option></select>
      <button class="btn" type="submit">Search</button>
    </form>
    <p class="muted" id="result-count"></p>
    <div class="grid" id="products"></div>
    <div class="pager" id="pager"></div>
  </main>
  <script src="/assets/app.js"></script>
  <script src="/assets/catalog.js"></script>
</body>
</html>
